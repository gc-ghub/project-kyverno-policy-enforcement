name: Policy Validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Kyverno CLI
        run: |
            curl -LO https://github.com/kyverno/kyverno/releases/download/v1.11.0/kyverno-cli_v1.11.0_linux_x86_64.tar.gz
            tar -xvf kyverno-cli_v1.11.0_linux_x86_64.tar.gz
            sudo mv kyverno /usr/local/bin/

      - name: Validate Kubernetes manifests against policies
        run: |
          kyverno apply kyverno_policy \
          --resource manifests/deployment.yaml \
          --resource manifests/namespace.yaml