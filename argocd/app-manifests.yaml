apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/gc-ghub/project-kyverno-policy-enforcement.git
    targetRevision: main
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true